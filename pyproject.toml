[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI's project name (not the GitHub repo, which stays e-gov-law-mcp): plain
# "e-gov-law-mcp" is blocked as confusingly similar to the existing, unrelated
# "egov-law-mcp" package. "japan-law-mcp" also better matches what this server
# does now — English translations, revision diffs, cross-references — beyond
# just wrapping e-Gov.
name = "japan-law-mcp"
version = "0.2.0"
description = "MCP server for Japan's e-Gov 法令API v2 — search, cite and quote Japanese statutes by article, including 附則/別表/号 and point-in-time (asof) lookups."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "gaijindev" },
]
keywords = ["mcp", "model-context-protocol", "japan", "law", "e-gov", "legal"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests",
    "fastmcp",
    "uvicorn",
    "starlette",
]

[project.urls]
Homepage = "https://github.com/gaijindev/e-gov-law-mcp"
Repository = "https://github.com/gaijindev/e-gov-law-mcp"
Issues = "https://github.com/gaijindev/e-gov-law-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "requests-mock",
]

[project.scripts]
japan-law-mcp = "server:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "cache.py", "english.py", "revision_diff.py", "xref.py"]

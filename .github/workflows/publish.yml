name: Publish to PyPI

# Trusted publishing (OIDC) — no PyPI token is stored as a GitHub secret.
# One-time setup on PyPI's side before the first run: on
# https://pypi.org/manage/account/publishing/, add a *pending* trusted
# publisher for a project named "e-gov-law-mcp" with:
#   Owner: gaijindev   Repository: e-gov-law-mcp
#   Workflow name: publish.yml   Environment: pypi
# PyPI creates the project on the first successful publish from that workflow.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/e-gov-law-mcp
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
